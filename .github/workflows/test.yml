name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: prefix-dev/setup-pixi@v0.9.5
      with:
        environments: test

    - name: Show environment info
      run: |
        pixi run -e test python -c "import tensorflow as tf; print(f'TensorFlow {tf.__version__}')"

    - name: Run tests
      env:
        CUDA_VISIBLE_DEVICES: "-1"
        TF_CPP_MIN_LOG_LEVEL: "2"
      run: |
        pixi run -e test pytest tests/ -v -n auto --cov=locator --cov-report=xml --cov-report=term-missing

    - name: Upload coverage reports
      uses: codecov/codecov-action@v6
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: prefix-dev/setup-pixi@v0.9.5
      with:
        environments: test

    - name: Check linting
      run: pixi run -e test ruff check locator/ tests/ scripts/ example/

    - name: Check formatting
      run: pixi run -e test ruff format --check locator/ tests/ scripts/ example/
