name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        environments: docs

    - name: Build documentation
      run: |
        pixi run -e docs make -C docs clean
        pixi run -e docs make -C docs html

    - name: Check for documentation warnings
      run: |
        pixi run -e docs make -C docs html 2>&1 | tee build_output.txt

        if grep -i "warning" build_output.txt | grep -v "Protobuf gencode version" | grep -v "UserWarning" | grep -v "warnings\.warn" | grep -v "absl::InitializeLog" | grep -q .; then
          echo "Documentation build produced warnings:"
          grep -i "warning" build_output.txt | grep -v "Protobuf gencode version" | grep -v "UserWarning" | grep -v "warnings\.warn" | grep -v "absl::InitializeLog"
          exit 1
        fi

        echo "Documentation build completed successfully"

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v7
      with:
        name: documentation
        path: docs/build/html/
