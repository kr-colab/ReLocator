[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "locator"
version = "1.2.1"
description = "Supervised machine learning of geographic location from genetic variation"
readme = "README.md"
license = "NPOSL-3.0"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Andrew Kern", email = "adkern@uoregon.edu" },
]

dependencies = [
    "numpy>=1.26.4",
    "tensorflow>=2.16",
    "h5py",
    "scikit-allel",
    "scikit-learn",
    "matplotlib",
    "scipy",
    "tqdm",
    "pandas",
    "zarr",
    "seaborn",
    "plotly",
    # geospatial
    "cartopy",
    "geopy",
    "geopandas",
    "rasterio",
    "rasterstats",
    "shapely",
    "affine",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "pre-commit",
]
docs = [
    "sphinx>=4.0,<9.0",
    "sphinx_rtd_theme>=2.0.0",
    "sphinx-autodoc-typehints",
    "sphinx-autobuild",
]
ray = [
    "ray[train]>=2.9.0",
    "ray[data]>=2.9.0",
]
fast-vcf = [
    "bio2zarr[vcf]",
]

[project.scripts]
locator = "locator.cli:main"
vcf_to_zarr = "scripts.vcf_to_zarr:main"

[project.urls]
Homepage = "https://github.com/kr-colab/ReLocator"
"Bug Reports" = "https://github.com/kr-colab/ReLocator/issues"

[tool.setuptools.packages.find]
include = ["locator*"]

# --- Tool configuration ------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-n",
    "auto",
    "--dist",
    "loadfile",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
]

[tool.coverage.run]
source = ["locator"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.ruff]
line-length = 89
target-version = "py310"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".pixi",
    "build",
    "dist",
    "docs/build",
    "work",
    "out",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "D",      # pydocstyle
]
ignore = [
    "E203",
    "E266",
    "E402",
    "E501",
    "D100",
    "D103",
    "D104",
    "D200",
    "D205",
    "D301",
    "D400",
    "D401",
    "B006",
    "B007",
    "B008",
    "B023",
    "B028",
    "C401",
    "C408",
    "C419",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM112",
    "SIM114",
    "SIM117",
    "SIM118",
    "B904",
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["D", "F401", "F403", "E501", "S101"]
"locator/prediction.py" = ["C901"]
"locator/plotting.py" = ["C901"]
"scripts/locator_phased.py" = ["C901"]
"example/*.ipynb" = ["F811", "F821", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["locator"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.codespell]
skip = "*.ipynb,*.html,*.css,*.js,.git,build,dist,.pixi"
ignore-words-list = "assertIn,Battey"

[tool.isort]
profile = "black"
line_length = 89
known_first_party = ["locator"]

[tool.black]
line-length = 89
target-version = ['py310', 'py311', 'py312']
