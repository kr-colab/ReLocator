[build-system]
requires = ["setuptools>=45", "wheel", "numpy>=1.20.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-n",
    "auto",
    "--dist",
    "loadfile",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
]
# Parallel execution settings
# The -n auto flag in CI will override this
# For local development, you can set: pytest -n 4

[tool.coverage.run]
source = ["locator"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 89
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
known_first_party = ["locator"]

# Ruff configuration (replaces black, isort, flake8)
[tool.ruff]
line-length = 89
target-version = "py38"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "docs/build",
    "work",
    "out",
]

[tool.ruff.format]
# Use double quotes for strings (matches black default)
quote-style = "double"
# Indent with spaces (matches black default)
indent-style = "space"
# Respect magic trailing commas (matches black default)
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade - modernizes Python syntax
    "D",      # pydocstyle - docstring checks
]
ignore = [
    # pycodestyle
    "E203",   # whitespace before ':' (conflicts with black)
    "E266",   # too many leading '#' for block comment
    "E402",   # module level import not at top of file
    "E501",   # line too long (handled by formatter)
    # pydocstyle
    "D100",   # missing docstring in public module
    "D103",   # missing docstring in public function
    "D104",   # missing docstring in public package
    "D200",   # one-line docstring should fit on one line
    "D205",   # 1 blank line required between summary and description
    "D301",   # use r""" if any backslashes in docstring
    "D400",   # first line should end with a period
    "D401",   # first line should be in imperative mood
    # flake8-bugbear
    "B006",   # mutable default argument
    "B007",   # unused loop variable
    "B008",   # function call in default argument
    "B023",   # function uses loop variable
    "B028",   # no explicit stacklevel in warnings.warn
    # flake8-comprehensions
    "C401",   # unnecessary generator
    "C408",   # unnecessary dict call
    "C419",   # unnecessary list comprehension
    # flake8-simplify
    "SIM102", # use single if instead of nested if
    "SIM105", # use contextlib.suppress
    "SIM108", # use ternary operator (style preference)
    "SIM112", # use capitalized env vars (Ray uses lowercase)
    "SIM114", # combine if branches
    "SIM117", # use single with statement
    "SIM118", # use key in dict
    # flake8-bugbear (exception chaining - would require code changes)
    "B904",   # raise from err/None in except clause
    # pyupgrade (type annotation modernization - requires Python 3.10+)
    "UP006",  # use tuple instead of Tuple
    "UP007",  # use X | Y instead of Union[X, Y]
    "UP045",  # use X | None instead of Optional[X]
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # unused imports, star imports OK in __init__
"tests/*" = ["D", "F401", "F403", "E501", "S101"]  # relaxed rules for tests
"locator/prediction.py" = ["C901"]  # allow complex functions
"locator/plotting.py" = ["C901"]    # allow complex functions
"scripts/locator_phased.py" = ["C901"]
"example/*.ipynb" = ["F811", "F821", "E402"]  # notebooks have cell-level scope

[tool.ruff.lint.isort]
known-first-party = ["locator"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Codespell configuration
[tool.codespell]
skip = "*.ipynb,*.html,*.css,*.js,.git,build,dist"
ignore-words-list = "assertIn,Battey"

# Legacy black config (kept for tools that still read it)
[tool.black]
line-length = 89
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
