[workspace]
name = "locator"
version = "1.2.1"
description = "Supervised machine learning of geographic location from genetic variation"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.26"
h5py = ">=3.0"
scikit-allel = ">=1.3"
scikit-learn = ">=1.0"
matplotlib = ">=3.5"
scipy = ">=1.10"
pandas = ">=2.0"
tqdm = ">=4.60"
zarr = ">=2.14"
seaborn = ">=0.12"
plotly = ">=5.0"
# geospatial
cartopy = ">=0.21"
geopy = ">=2.3"
geopandas = ">=0.13"
rasterio = ">=1.3"
rasterstats = ">=0.19"
shapely = ">=2.0"
affine = ">=2.4"

[pypi-dependencies]
locator = { path = ".", editable = true }

# --- CUDA feature -----------------------------------------------------------

[feature.cuda]
system-requirements = { cuda = "12" }

[feature.cuda.dependencies]
tensorflow = { version = ">=2.18", build = "cuda*" }
cuda-version = "12.*"
cuda-nvcc = "*"
cuda-compat = "*"

[feature.cuda.activation.env]
XLA_FLAGS = "--xla_gpu_cuda_data_dir=$CONDA_PREFIX"

# --- CPU feature -------------------------------------------------------------

[feature.cpu.dependencies]
tensorflow = { version = ">=2.16", build = "cpu*" }

# --- Ray feature (multi-GPU parallel execution) ------------------------------

[feature.ray.dependencies]
ray-default = ">=2.9"

# --- Fast VCF (bio2zarr + cyvcf2) --------------------------------------------

[feature.fast-vcf.dependencies]
cyvcf2 = ">=0.30"

[feature.fast-vcf.pypi-dependencies]
bio2zarr = ">=0.1"

# --- Dev/test feature --------------------------------------------------------

[feature.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
pytest-xdist = ">=3.0"
ruff = ">=0.4"
pre-commit = ">=3.0"

# --- Docs feature ------------------------------------------------------------

[feature.docs.dependencies]
sphinx = ">=4.0,<9.0"
sphinx_rtd_theme = ">=2.0"

[feature.docs.pypi-dependencies]
sphinx-autodoc-typehints = ">=2.0"
sphinx-autobuild = ">=2024.0"

# --- Environments ------------------------------------------------------------

[environments]
default = ["cuda", "ray", "fast-vcf", "dev"]
cpu = ["cpu", "ray", "fast-vcf", "dev"]
test = ["cpu", "dev"]
docs = ["cpu", "docs"]
minimal = ["cpu"]

# --- Tasks -------------------------------------------------------------------

[tasks]
test = { cmd = "pytest tests/ -v -m 'not slow and not gpu'" }
test-all = { cmd = "pytest tests/ -v" }
lint = { cmd = "ruff check locator/ tests/" }
format = { cmd = "ruff format locator/ tests/" }
docs = { cmd = "make html", cwd = "docs" }
